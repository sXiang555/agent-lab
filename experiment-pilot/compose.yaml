services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: pilot
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD: pilot_local
    volumes:
      - pilot-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pilot", "-d", "pilot"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      PILOT_DATABASE_URL: ${PILOT_DATABASE_URL:-postgresql://pilot:pilot_local@db:5432/pilot}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 4s
      timeout: 3s
      retries: 15
  web:
    build: ./web
    environment:
      PILOT_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/pilot/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 4s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:${PILOT_WEB_PORT:-3000}:3000"
volumes:
  pilot-db:
