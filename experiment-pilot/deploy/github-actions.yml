# Standalone repo: copy to .github/workflows/experiment-pilot.yml.
# In agent-lab, also set defaults.run.working-directory and prefix the cache/artifact paths.
name: ExperimentPilot
permissions:
  contents: read
on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make check
      - run: make production-smoke
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: evals/reports/baseline.json
