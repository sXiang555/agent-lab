[project]
name = "experiment-pilot"
version = "0.1.0"
description = "An evidence-first experiment review and rerun approval agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langgraph-checkpoint-postgres>=3,<4",
    "mcp>=1.25,<2",
    "openai>=2,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
observability = ["langfuse>=3,<5"]

[project.scripts]
experiment-pilot-import = "experiment_pilot.import_runs:main"
experiment-pilot-mcp = "experiment_pilot.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/experiment_pilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
