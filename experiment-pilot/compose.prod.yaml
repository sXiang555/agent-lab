services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: pilot
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pilot-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pilot", "-d", "pilot"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: .
    restart: unless-stopped
    environment:
      PILOT_PRODUCTION: "1"
      PILOT_DEMO_AUTH: "0"
      PILOT_PUBLIC_SHOWCASE: "${PILOT_PUBLIC_SHOWCASE:-1}"
      PILOT_DATABASE_URL: postgresql://pilot@db:5432/pilot
      PILOT_DB_PASSWORD_FILE: /run/secrets/db_password
      PILOT_ANALYST_TOKEN_FILE: /run/secrets/analyst_token
      PILOT_REVIEWER_TOKEN_FILE: /run/secrets/reviewer_token
      PILOT_REQUESTS_PER_MINUTE: "${PILOT_REQUESTS_PER_MINUTE:-12}"
    secrets: [db_password, analyst_token, reviewer_token]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 15
  web:
    build: ./web
    restart: unless-stopped
    environment:
      PILOT_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/pilot/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 15
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      PILOT_SITE_ADDRESS: "${PILOT_SITE_ADDRESS:?Set a public DNS hostname or localhost for testing}"
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${PILOT_BIND_IP:-0.0.0.0}:${PILOT_HTTP_PORT:-80}:80"
      - "${PILOT_BIND_IP:-0.0.0.0}:${PILOT_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 15
secrets:
  db_password:
    file: "${PILOT_SECRETS_DIR:-./.secrets}/db_password"
  analyst_token:
    file: "${PILOT_SECRETS_DIR:-./.secrets}/analyst_token"
  reviewer_token:
    file: "${PILOT_SECRETS_DIR:-./.secrets}/reviewer_token"
volumes:
  pilot-db:
  caddy-data:
  caddy-config:
